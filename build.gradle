plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.thymeleaf'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

configurations.all {
    resolutionStrategy.force 'org.jboss.logging:jboss-logging:3.4.3.Final'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // https://mvnrepository.com/artifact/mysql/mysql-connector-java
    implementation group: 'mysql', name: 'mysql-connector-java', version: '8.0.33'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa'

    implementation group: 'org.flywaydb', name: 'flyway-core', version: '10.10.0'
    implementation group: 'org.flywaydb', name: 'flyway-mysql', version: '10.10.0'

    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.0'

    //Redis implement
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-redis'
    implementation group: 'io.lettuce', name: 'lettuce-core'

    implementation 'org.jboss.logging:jboss-logging'

    // AWS SDK v2 (S3)
    implementation platform('com.amazonaws:aws-java-sdk-bom:1.12.422')
    implementation platform('software.amazon.awssdk:bom:2.20.19')
    implementation 'com.amazonaws:aws-java-sdk-s3'

}

tasks.named('test') {
    useJUnitPlatform()
}
