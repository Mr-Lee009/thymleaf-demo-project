<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet" href="/assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/assets/css/common.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" type="application/javascript"></script>

</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-8 seating">
                <!-- generate seating here -->
            </div>
            <div class="col-sm-4 info-booking">
              <h2>Infor booking</h2>

              <!-- Tabs Navigation -->
              <ul class="nav nav-tabs" id="myTab" role="tablist">
                  <li class="nav-item" role="presentation">
                      <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home" type="button" role="tab">
                          Home
                      </button>
                  </li>
                  <li class="nav-item" role="presentation">
                      <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button" role="tab">
                          Profile
                      </button>
                  </li>
                  <li class="nav-item" role="presentation">
                      <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button" role="tab">
                          Contact
                      </button>
                  </li>
              </ul>
          
              <!-- Tabs Content -->
              <div class="tab-content mt-3" id="myTabContent">
                  <div class="tab-pane fade show active" id="home" role="tabpanel">
                      <p>This is the Home tab content.</p>
                  </div>
                  <div class="tab-pane fade" id="profile" role="tabpanel">
                      <p>This is the Profile tab content.</p>
                  </div>
                  <div class="tab-pane fade" id="contact" role="tabpanel">
                      <p>This is the Contact tab content.</p>
                  </div>
              </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        
    </div>

    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/seat.js"></script>
</body>

</html>
