<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/assets/css/custom.css" />
</head>

<body class="container-fluid ">
    <div class="container-fluid row green-two">
        <form class="row g-3 needs-validation" novalidate>
            <div class="col-md-4">
              <label for="productName" class="form-label">Product Name</label>
              <input type="text" class="form-control validate" id="productName" value="Mark" name="productName" required>
             
            </div>

            <div class="col-md-4">
              <label for="orderName" class="form-label">Order Name</label>
              <input type="text" class="form-control validate" id="orderName" value="Otto" name= 'orderName' required>
              
            </div>

            <div class="col-md-4">
              <label for="validationCustomUsername" class="form-label">Username</label>
              <div class="input-group has-validation">
                <span class="input-group-text" id="inputGroupPrepend">@</span>
                <input type="text" class="form-control validate" id="validationCustomUsername" aria-describedby="inputGroupPrepend" required>
                
              </div>
            </div>

            <div class="col-md-6">
              <label for="validationCustom03" class="form-label">City</label>
              <input type="text" class="form-control validate" id="validationCustom03" required>
            </div>

            <div class="col-md-3">
              <label for="validationCustom04" class="form-label">State</label>
              <select class="form-select validate" id="validationCustom04" required>
                <option selected disabled value="">Choose...</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
              </select>
              
            </div>

            <div class="col-md-3">
              <label for="validationCustom05" class="form-label">Zip</label>
              <input type="text" class="form-control validate" id="validationCustom05" required>
            </div>

            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input validate" type="checkbox" value="" id="invalidCheck" required>
                <label class="form-check-label" for="invalidCheck">
                  Agree to terms and conditions
                </label>
              </div>
            </div>

            <div class="col-12">
              <button class="btn btn-primary btn-submit" type="submit">Submit form</button>
            </div>
        </form>
    </div>

    
</body>
<script src="/assets/js/jquery.min.js" type="application/javascript"></script>
<script src="/assets/js/common.validate.js" type="application/javascript"></script>
<script src="/assets/js/validate.js" type="application/javascript"></script>
