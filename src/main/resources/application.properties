spring.application.name=demo
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#spring.main.allow-bean-definition-overriding=true
#========================================================
#=                      JDBC connection                 =
#========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/test
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.writer.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.database=MYSQL
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}


#========================================================
#=                      Flyway config                   =
#========================================================
spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://localhost:3306/test
spring.flyway.user=root
spring.flyway.password=root
spring.flyway.locations=classpath:db/migration
#phien ban baseline se = 1 va ko thuc hien bat ki thay doi nao
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0