
spring.application.name=demo-thymleaf
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB
#spring.main.allow-bean-definition-overriding=true
#========================================================
#=                      JDBC connection                 =
#========================================================
spring.main.allow-bean-definition-overriding=true

#MARTER DB
spring.datasource.write.jdbc-url=jdbc:mysql://localhost:3307/testdb
spring.datasource.write.username=root
spring.datasource.write.password=root
spring.datasource.write.driver-class-name=com.mysql.cj.jdbc.Driver

#SLAVE-1 DB
spring.datasource.read1.jdbc-url=jdbc:mysql://localhost:3308/testdb
spring.datasource.read1.username=root
spring.datasource.read1.password=root
spring.datasource.read1.driver-class-name=com.mysql.cj.jdbc.Driver

#SLAVE-2 DB
spring.datasource.read2.jdbc-url=jdbc:mysql://localhost:3308/testdb
spring.datasource.read2.username=root
spring.datasource.read2.password=root
spring.datasource.read2.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.database=MYSQL
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}
spring.jpa.properties.hibernate.transaction.coordinator_class=jdbc


#========================================================
#=                      Flyway config                   =
#========================================================
spring.flyway.enabled=false
spring.flyway.url=jdbc:mysql://localhost:3307/testdb
spring.flyway.user=root
spring.flyway.password=root
spring.flyway.locations=classpath:dev/db/migration
#phien ban baseline se = 1 va ko thuc hien bat ki thay doi nao
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

#========================================================
#=                      Flyway config                   =
#========================================================
spring.data.redis.host=10.1.37.206
spring.data.redis.port=6379


#========================================================
#=                      S3 config                       =
#========================================================
aws.s3.accessKey=xxx
aws.s3.secretKey=xxx
aws.s3.region=ap-northeast-1
aws.s3.bucket.name=xxxx
