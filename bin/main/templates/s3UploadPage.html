    async function uploadFileMultipart(file) {
        const key = "training/" + file.name;
        console.info(key);

        // Step 1: Initiate multipart upload
        const initRes = await $.post(API_BASE + '/initiate?filename=' + key);
        const uploadId = initRes.uploadId;
        log('Initiated upload: ' + uploadId);

        const partCount = Math.ceil(file.size / PART_SIZE);
        const parts = [];

        const CONCURRENT_UPLOADS = 5; // chỉ upload tối đa 5 part cùng lúc

        let partNumber = 1;
        while (partNumber <= partCount) {
            const currentBatch = [];

            // tạo 1 nhóm tối đa 5 parts
            for (let i = 0; i < CONCURRENT_UPLOADS && partNumber <= partCount; i++, partNumber++) {
                const currentPartNumber = partNumber; //  "chốt" giá trị tại thời điểm này

                const start = (currentPartNumber - 1) * PART_SIZE;
                const end = Math.min(start + PART_SIZE, file.size);
                const blob = file.slice(start, end);

                const presignedRes = await $.get(API_BASE + '/presigned-url', {
                    key,
                    uploadId,
                    partNumber
                });
                const url = presignedRes.url;
                console.info(`url for part ${currentPartNumber}:`, url);

                // push 1 promise upload vào batch
                // const uploadPromise = uploadPartWithFetch(url, blob)
                const uploadPromise = uploadPartWithRetry(url, blob, 3)
                    .then(eTag => ({
                        partNumber: currentPartNumber,
                        eTag: eTag
                    }));

                currentBatch.push(uploadPromise);

                log(`Started upload part ${currentPartNumber}/${partCount}`);
            }

            // Chờ tất cả trong batch upload xong
            const batchResults = await Promise.all(currentBatch);
            parts.push(...batchResults);

            console.log(`Batch uploaded: ${batchResults.length} parts`);
        }

        console.log('All parts uploaded:', parts);
        console.log('complete request:', JSON.stringify({ key, uploadId, parts }));

        // Step 4: Complete multipart upload
        await $.ajax({
            url: API_BASE + '/complete',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ key, uploadId, parts })
        });

        log('Upload complete!');
    }

    function uploadPartWithFetch(url, blob) {
        return fetch(url, {
            method: 'PUT',
            body: blob,
        }).then(response => {
            if (!response.ok) {
                throw new Error('Upload failed with status ' + response.status);
            }

            // Iterate through headers
            // for (const [name, value] of headers.entries()) {
            //     console.log(`${name}: ${value}`);
            // }

            const eTag = response.headers.get('ETag')?.replaceAll('"', '');
            if (!eTag) {
                console.warn('No ETag found in response headers');
            } else {
                console.info('Received ETag:', eTag);
            }
            return eTag;
        }).catch(error => {
            console.error("Upload error:", error);
            throw error;
        });
    }

    async function uploadPartWithRetry(url, blob, retries = 3) {
        for (let attempt = 1; attempt <= retries; attempt++) {
            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    body: blob
                });

                if (!response.ok) {
                    throw new Error(`Upload failed with status ${response.status}`);
                }

                const eTag = response.headers.get('ETag')?.replace(/"/g, '');
                if (!eTag) throw new Error("ETag not found");
                return eTag;

            } catch (err) {
                console.warn(`Retry ${attempt}/${retries} failed:`, err.message);
                if (attempt === retries) throw err;
                await wait(1000 * attempt); // exponential backoff: 1s, 2s, 3s...
            }
        }
    }

    // delay function
    function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    $('#uploadBtn').click(() => {
        const file = $('#fileInput')[0].files[0];
        if (!file) return alert('Please choose a file!');
        uploadFileMultipart(file).catch(e => log('Error: ' + e));
    });
</script>
