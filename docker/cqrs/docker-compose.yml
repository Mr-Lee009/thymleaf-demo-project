version: '3.8'
services:
  command-db:
    image: library/mysql:8.0
    container_name: command-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user1
      MYSQL_PASSWORD: pass1
      MYSQL_DATABASE: command_db
    ports:
      - "3308:3306"
    networks:
      - cqrs-net

  query-db:
    image: library/mysql:8.0
    container_name: query-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user2
      MYSQL_PASSWORD: pass2
      MYSQL_DATABASE: query_db
    ports:
      - "3307:3306"
    networks:
      - cqrs-net

