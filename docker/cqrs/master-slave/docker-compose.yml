version: '3.8'

services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    ports:
      - "3307:3306"
    volumes:
      - ./master/my.cnf:/etc/mysql/conf.d/my.cnf
      - master_data:/var/lib/mysql
    networks:
      - mysql-net

  mysql-slave-1:
    image: mysql:8.0
    container_name: mysql-slave-1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    ports:
      - "3308:3306"
    volumes:
      - ./slave-1/my.cnf:/etc/mysql/conf.d/my.cnf
      - slave_data_1:/var/lib/mysql
    depends_on:
      - mysql-master
    networks:
      - mysql-net

  mysql-slave-2:
    image: mysql:8.0
    container_name: mysql-slave-2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    ports:
      - "3309:3306"
    volumes:
      - ./slave-2/my.cnf:/etc/mysql/conf.d/my.cnf
      - slave_data_2:/var/lib/mysql
    depends_on:
      - mysql-master
    networks:
      - mysql-net
volumes:
  master_data:
  slave_data_1:
  slave_data_2:
networks:
  mysql-net:
